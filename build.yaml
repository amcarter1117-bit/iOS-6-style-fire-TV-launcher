name: Build iOS6 Launcher APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project files
        run: |
          mkdir -p "$HOME/proj"
          cd "$HOME/proj"
          cat > "settings.gradle.kts" <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IOS6Launcher"
          include(":app")
          EOF_FILE
          cat > "build.gradle.kts" <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > "gradle.properties" <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ios6launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ios6launcher"
                  minSdk = 22
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/ic_launcher"
                  android:label="iOS 6 Launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                      <!-- Shows up in the Fire TV app list -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                      <!-- Lets it act as a home screen -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_launcher.xml" <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#5B6371"
                  android:pathData="M20,0h56a20,20 0 0 1 20,20v56a20,20 0 0 1 -20,20h-56a20,20 0 0 1 -20,-20v-56a20,20 0 0 1 20,-20z" />
              <path
                  android:fillColor="#66FFFFFF"
                  android:pathData="M20,0h56a20,20 0 0 1 20,20v14c-20,12 -76,12 -96,0v-14a20,20 0 0 1 20,-20z" />
          </vector>
          EOF_FILE
          mkdir -p "app/src/main/java/com/example/ios6launcher"
          cat > "app/src/main/java/com/example/ios6launcher/AppTile.kt" <<'EOF_FILE'
          package com.example.ios6launcher

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.text.TextPaint
          import android.text.TextUtils
          import android.view.View

          data class AppInfo(
              val pkg: String,
              val activity: String,
              val label: String,
              val icon: Drawable
          )

          /**
           * One glossy iOS 6-style icon, drawn entirely in code.
           * The real app icon sits on a light plate, then gets the classic
           * curved gloss highlight, bevel, and drop shadow.
           */
          class AppTile(
              context: Context,
              private val showLabel: Boolean = true,
              focusableTile: Boolean = false
          ) : View(context) {

              var info: AppInfo? = null
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val d = resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.DEFAULT_BOLD
                  setShadowLayer(2f * d, 0f, 1.5f * d, Color.BLACK)
              }
              private val clip = Path()
              private val rect = RectF()
              private val tmp = RectF()

              init {
                  // Grid tiles are not focusable themselves; the GridView marks them selected.
                  isFocusable = focusableTile
                  isFocusableInTouchMode = false
              }

              override fun onDraw(c: Canvas) {
                  val inf = info ?: return
                  val w = width.toFloat()
                  val size = w * 0.62f
                  val left = (w - size) / 2f
                  val top = w * 0.10f
                  rect.set(left, top, left + size, top + size)
                  val r = size * 0.225f
                  val active = isSelected || isFocused

                  c.save()
                  if (active) c.scale(1.1f, 1.1f, rect.centerX(), rect.centerY())

                  // Soft drop shadow
                  fill.color = Color.argb(30, 0, 0, 0)
                  for (i in 4 downTo 1) {
                      tmp.set(
                          rect.left - i * d * 0.5f,
                          rect.top + i * d,
                          rect.right + i * d * 0.5f,
                          rect.bottom + i * d * 1.6f
                      )
                      c.drawRoundRect(tmp, r + i * d * 0.5f, r + i * d * 0.5f, fill)
                  }

                  // Focus glow behind the icon
                  if (active) {
                      for (i in 5 downTo 1) {
                          stroke.strokeWidth = d * i * 3f
                          stroke.color = Color.argb(40, 120, 190, 255)
                          c.drawRoundRect(rect, r, r, stroke)
                      }
                  }

                  // Light plate
                  fill.shader = LinearGradient(
                      0f, rect.top, 0f, rect.bottom,
                      0xFFF6F6F6.toInt(), 0xFFC6C6C6.toInt(), Shader.TileMode.CLAMP
                  )
                  c.drawRoundRect(rect, r, r, fill)
                  fill.shader = null

                  // Everything else is clipped to the rounded square
                  clip.reset()
                  clip.addRoundRect(rect, r, r, Path.Direction.CW)
                  c.save()
                  c.clipPath(clip)

                  val inset = size * 0.12f
                  inf.icon.setBounds(
                      (rect.left + inset).toInt(), (rect.top + inset).toInt(),
                      (rect.right - inset).toInt(), (rect.bottom - inset).toInt()
                  )
                  inf.icon.draw(c)

                  // Darken the bottom slightly
                  fill.shader = LinearGradient(
                      0f, rect.centerY(), 0f, rect.bottom,
                      0x00000000, 0x38000000, Shader.TileMode.CLAMP
                  )
                  c.drawRect(rect, fill)
                  fill.shader = null

                  // Classic curved gloss on the top half
                  tmp.set(
                      rect.left - size * 0.3f, rect.top - size * 0.95f,
                      rect.right + size * 0.3f, rect.top + size * 0.52f
                  )
                  fill.shader = LinearGradient(
                      0f, rect.top, 0f, rect.top + size * 0.52f,
                      0xB8FFFFFF.toInt(), 0x30FFFFFF, Shader.TileMode.CLAMP
                  )
                  c.drawOval(tmp, fill)
                  fill.shader = null
                  c.restore()

                  // Bevel: dark outer edge, light inner edge
                  stroke.strokeWidth = d * 1.2f
                  stroke.color = 0x99000000.toInt()
                  c.drawRoundRect(rect, r, r, stroke)
                  tmp.set(rect)
                  tmp.inset(d * 1.2f, d * 1.2f)
                  stroke.color = 0x55FFFFFF
                  c.drawRoundRect(tmp, r - d, r - d, stroke)

                  // Crisp focus ring
                  if (active) {
                      tmp.set(rect)
                      tmp.inset(-d * 1.5f, -d * 1.5f)
                      stroke.strokeWidth = d * 2.5f
                      stroke.color = Color.WHITE
                      c.drawRoundRect(tmp, r + d, r + d, stroke)
                  }
                  c.restore()

                  if (showLabel) {
                      textPaint.textSize = w * 0.095f
                      val s = TextUtils.ellipsize(inf.label, textPaint, w * 0.94f, TextUtils.TruncateAt.END)
                      c.drawText(s.toString(), w / 2f, top + size + w * 0.17f, textPaint)
                  }
              }
          }
          EOF_FILE
          mkdir -p "app/src/main/java/com/example/ios6launcher"
          cat > "app/src/main/java/com/example/ios6launcher/MainActivity.kt" <<'EOF_FILE'
          package com.example.ios6launcher

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.AbsListView
          import android.widget.BaseAdapter
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView

          class MainActivity : Activity() {

              companion object {
                  private const val COLUMNS = 7
                  private const val DOCK_SLOTS = 4

                  // Edit this list to pin your favourite apps to the dock (in order).
                  // Any empty slots are filled with the first apps alphabetically.
                  private val DOCK_PACKAGES = listOf(
                      "com.netflix.ninja",
                      "com.amazon.firetv.youtube",
                      "com.amazon.firebat",
                      "com.disney.disneyplus"
                  )
              }

              private lateinit var grid: GridView
              private lateinit var dock: LinearLayout
              private lateinit var adapter: TileAdapter
              private var tileW = 0
              private var tileH = 0

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val dm = resources.displayMetrics
                  val sidePad = dp(48)
                  tileW = (dm.widthPixels - sidePad * 2) / COLUMNS
                  tileH = tileW

                  // Status bar
                  val status = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(0xFF4A4A4A.toInt(), 0xFF1C1C1C.toInt(), 0xFF000000.toInt())
                      )
                      addView(TextView(context).apply {
                          text = "Fire TV"
                          setTextColor(Color.WHITE)
                          textSize = 14f
                          setPadding(dp(16), 0, 0, 0)
                          gravity = Gravity.CENTER_VERTICAL
                      }, FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      addView(TextClock(context).apply {
                          format12Hour = "h:mm a"
                          format24Hour = "HH:mm"
                          setTextColor(Color.WHITE)
                          textSize = 15f
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                          gravity = Gravity.CENTER
                      }, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  }

                  // Icon grid
                  adapter = TileAdapter()
                  grid = GridView(this).apply {
                      numColumns = COLUMNS
                      columnWidth = tileW
                      stretchMode = GridView.NO_STRETCH
                      gravity = Gravity.CENTER_HORIZONTAL
                      selector = ColorDrawable(Color.TRANSPARENT)
                      clipChildren = false
                      clipToPadding = false
                      verticalSpacing = dp(8)
                      horizontalSpacing = 0
                      isVerticalScrollBarEnabled = false
                      setPadding(sidePad, dp(20), sidePad, dp(20))
                      this.adapter = this@MainActivity.adapter
                      setOnItemClickListener { _, _, pos, _ -> launch(this@MainActivity.adapter.items[pos]) }
                  }

                  // Dock
                  val dockLine = View(this).apply { setBackgroundColor(0x88FFFFFF.toInt()) }
                  dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      clipChildren = false
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(0x44FFFFFF, 0x14000000, 0x55000000)
                      )
                  }

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      clipChildren = false
                      addView(status, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(30)))
                      addView(grid, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                      addView(dockLine, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(1)))
                      addView(dock, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (tileW * 0.95f).toInt()))
                  }

                  val vignette = View(this).apply {
                      background = GradientDrawable().apply {
                          gradientType = GradientDrawable.RADIAL_GRADIENT
                          colors = intArrayOf(0x00000000, 0x99000000.toInt())
                          gradientRadius = maxOf(dm.widthPixels, dm.heightPixels) * 0.75f
                          setGradientCenter(0.5f, 0.45f)
                      }
                  }

                  val root = FrameLayout(this).apply {
                      background = linenDrawable()
                      clipChildren = false
                      addView(vignette, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      addView(content, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  }
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  refreshApps()
                  grid.requestFocus()
              }

              // A home screen should not exit on Back.
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  grid.setSelection(0)
              }

              private fun refreshApps() {
                  val all = loadApps()

                  val dockApps = DOCK_PACKAGES.mapNotNull { p -> all.find { it.pkg == p } }.toMutableList()
                  for (a in all) {
                      if (dockApps.size >= DOCK_SLOTS) break
                      if (!dockApps.contains(a)) dockApps.add(a)
                  }

                  dock.removeAllViews()
                  for (a in dockApps) {
                      dock.addView(AppTile(this, showLabel = false, focusableTile = true).apply {
                          info = a
                          setOnClickListener { launch(a) }
                      }, LinearLayout.LayoutParams(tileW, (tileW * 0.95f).toInt()))
                  }

                  adapter.items = all.filter { !dockApps.contains(it) }
                  adapter.notifyDataSetChanged()
              }

              private fun loadApps(): List<AppInfo> {
                  val pm = packageManager
                  val result = LinkedHashMap<String, AppInfo>()
                  for (cat in listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)) {
                      val query = Intent(Intent.ACTION_MAIN).addCategory(cat)
                      for (ri in pm.queryIntentActivities(query, 0)) {
                          val pkg = ri.activityInfo.packageName
                          if (pkg == packageName || result.containsKey(pkg)) continue
                          result[pkg] = AppInfo(pkg, ri.activityInfo.name, ri.loadLabel(pm).toString(), ri.loadIcon(pm))
                      }
                  }
                  return result.values.sortedBy { it.label.lowercase() }
              }

              private fun launch(app: AppInfo) {
                  try {
                      startActivity(
                          Intent(Intent.ACTION_MAIN)
                              .setComponent(ComponentName(app.pkg, app.activity))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (e: Exception) {
                      // App was removed or can't be opened; ignore.
                  }
              }

              /** Procedural linen texture, tiled across the screen. */
              private fun linenDrawable(): BitmapDrawable {
                  val s = 128
                  val bmp = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val cv = Canvas(bmp)
                  cv.drawColor(0xFF5B6371.toInt())
                  val p = Paint()
                  val rnd = java.util.Random(6)
                  for (i in 0 until s) {
                      p.color = if (rnd.nextBoolean()) Color.argb(18 + rnd.nextInt(14), 255, 255, 255)
                      else Color.argb(18 + rnd.nextInt(14), 0, 0, 0)
                      cv.drawLine(0f, i.toFloat(), s.toFloat(), i.toFloat(), p)
                  }
                  for (i in 0 until s) {
                      p.color = if (rnd.nextBoolean()) Color.argb(18 + rnd.nextInt(14), 255, 255, 255)
                      else Color.argb(18 + rnd.nextInt(14), 0, 0, 0)
                      cv.drawLine(i.toFloat(), 0f, i.toFloat(), s.toFloat(), p)
                  }
                  return BitmapDrawable(resources, bmp).apply {
                      setTileModeXY(Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                  }
              }

              private inner class TileAdapter : BaseAdapter() {
                  var items: List<AppInfo> = emptyList()

                  override fun getCount() = items.size
                  override fun getItem(position: Int) = items[position]
                  override fun getItemId(position: Int) = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val tile = (convertView as? AppTile) ?: AppTile(this@MainActivity).apply {
                          layoutParams = AbsListView.LayoutParams(tileW, tileH)
                      }
                      tile.info = items[position]
                      return tile
                  }
              }
          }
          EOF_FILE
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build APK
        run: |
          cd "$HOME/proj"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ios6-launcher-apk
          path: /home/runner/proj/app/build/outputs/apk/debug/app-debug.apk
